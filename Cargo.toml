[workspace]
resolver = "2"
members = ["kxbps-core", "kxbps-qt"]

[workspace.package]
version = "0.11.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
authors = ["Łukasz \"Khame\" Linhard"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
regex = "1.11"
