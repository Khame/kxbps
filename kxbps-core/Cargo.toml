[package]
name = "kxbps-core"
version.workspace = true
edition.workspace = true

# The privileged helper polkit runs as root; the package installs it as
# `/usr/libexec/kxbps-mirror-apply`, which is the path the policy annotates.
[[bin]]
name = "kxbps-mirror-apply"
path = "src/bin/kxbps-mirror-apply.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
regex = { workspace = true }
